version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: callsign-postgres
    environment:
      POSTGRES_USER: callsign
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: callsign_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/postgresql/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - callsign-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsign"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: callsign-mongodb
    environment:
      MONGO_INITDB_DATABASE: callsign
      MONGO_INITDB_ROOT_USERNAME: callsign
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - callsign-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: callsign-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - callsign-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: callsign-server
    environment:
      NODE_ENV: development
      PORT: 3000
      SERVER_URL: http://localhost:3000
      CLIENT_URL: http://localhost:3000

      # Database URLs
      DATABASE_URL: postgresql://callsign:password123@postgres:5432/callsign_db
      MONGODB_URL: mongodb://callsign:password123@mongodb:27017/callsign?authSource=admin
      REDIS_URL: redis://redis:6379

      # Auth
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRATION: 7d

      # Logging
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - callsign-network
    volumes:
      - ./server/src:/app/src
      - ./server/logs:/app/logs
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer (Database Management UI)
  adminer:
    image: adminer:latest
    container_name: callsign-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
    networks:
      - callsign-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Mongo Express (MongoDB UI)
  mongo-express:
    image: mongo-express:latest
    container_name: callsign-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: callsign
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://callsign:password123@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - callsign-network

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: callsign-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - callsign-network

networks:
  callsign-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
